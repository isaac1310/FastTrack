<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EAE3F6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B0E11" media="(prefers-color-scheme: dark)" />
<title>Aviente Health Track</title>
<link rel="manifest" href="assets/manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Petit+Formal+Script&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Retro palettes. One design language, two lightness inversions:
     light = saturated ink on pastel ground, dark = pastel ink on deep ground.
     Same hues in both, so a component keeps its meaning across the switch.

     EVERY ratio below is measured, never judged. Format is
     surface / surface2 / page. Recompute before changing any value.
     ============================================================ */
  :root, [data-theme="light"]{
    color-scheme: light;
    --page:#EAE3F6; --bg:#EAE3F6; --surface:#FFFFFF; --surface2:#E4F7F4; --surface3:#F3EDFB;
    --border:#DCD3F0; --border2:#DCD3F0; --rule:#DCD3F0;

    --text:#3F3D56;    /* 10.43 /  9.39 /  8.35 */
    --muted:#5B4F7C;   /*  7.36 /  6.62 /  5.89 */
    --dim:#6B5F8C;     /*  5.77 /  5.19 /  4.62 */
    --head:#5B21B6;    /*  8.98 /  8.09 /  7.19 */
    --link:#6D28D9;    /*  7.10 /  6.40 /  5.69 */
    --flag:#9D174D;    /*  7.88 /  7.10 /  6.31 */
    /* #0F766E measured 4.38 on the page ground — a FAIL. Darkened. */
    --accent:#0D6259;  /*  7.22 /  6.50 /  5.78 */
    --accent-hi:#0B554E; --onAccent:#FFFFFF; /* 7.22 on accent */
    --onHead:#FFFFFF;  /* 8.98 on head */

    --flagBg:#FBCFE8; --flagBorder:#F0ABFC; --pickWash:#FDF9FE;
    --ringTrack:#F3EDFB; --chipInk:#1A1725; --tagInk:#1A1725;
    --tagCarb:#FDE047; --tagHappy:#C4B5FD; --tagCraving:#F0ABFC;
    --chipFast:#99F6E4; --chipDay:#C4B5FD; --chipWeek:#FBCFE8;
    --chipTrack:#E4F7F4; --chipIntake:#FDE047; --chipSet:#F3EDFB;
    --up:#9D174D; --down:#0D6259;
    --cardShadow:0 2px 0 #C4B5FD, 0 14px 34px rgba(91,33,182,.10);
    /* legacy aliases still referenced by v2 cards */
    --gold:#5B21B6; --gold-deep:#6D28D9; --gold-hi:#4C1D95; --sage:#0D6259;
    --rust:#9D174D; --sky:#6D28D9;

    --r-card:18px; --r-tile:12px; --r-tile-lg:14px; --r-ctl:11px; --r-pill:999px;
    --gap:12px; --pad:16px; --side:14px;
  }

  /* Duotone night. The retro purple dark measured 1.09 surface-vs-page — the
     cards were effectively invisible on a phone. This is near-black ground,
     lifted surfaces (1.21) with a real border (1.62), and ONE accent hue.
     Ratios are surface / surface2 / page. */
  [data-theme="dark"]{
    color-scheme: dark;
    --page:#0B0E11; --bg:#0B0E11; --surface:#1C222A; --surface2:#2B333D; --surface3:#3A444F;
    --border:#2B333D; --border2:#3A444F; --rule:#3A444F;

    --text:#F4F7F9;    /* 14.88 / 11.88 / 17.99 */
    --muted:#B6C2CC;   /*  8.83 /  7.04 / 10.67 */
    --dim:#98A5B1;     /*  6.37 /  5.08 /  7.70 */
    --head:#D6F5F0;    /* 13.86 / 11.06 / 16.75 */
    --link:#A8E2F7;    /* 11.35 /  9.06 / 13.72 */
    --flag:#F7ADAD;    /*  8.79 /  7.02 / 10.63 */
    --accent:#5EEAD4;  /* 10.82 /  8.64 / 13.08 */
    --accent-hi:#8FF3E3; --onAccent:#0B0E11; /* 13.08 on accent */
    --onHead:#0B0E11;  /* 16.75 on head */

    --flagBg:rgba(247,173,173,.12); --flagBorder:rgba(247,173,173,.38);
    --pickWash:#232B34; --ringTrack:#2B333D; --chipInk:#0B0E11; --tagInk:#F4F7F9;
    /* one hue, three weights — duotone rather than a colour per tag */
    --tagCarb:#2B4A46; --tagHappy:#28414E; --tagCraving:#4A3336;
    --chipFast:#5EEAD4; --chipDay:#8FF3E3; --chipWeek:#A8E2F7;
    --chipTrack:#5EEAD4; --chipIntake:#8FF3E3; --chipSet:#3A444F;
    --up:#F7ADAD; --down:#5EEAD4;
    --cardShadow:0 1px 0 rgba(94,234,212,.10);
    --gold:#D6F5F0; --gold-deep:#5EEAD4; --gold-hi:#8FF3E3; --sage:#5EEAD4;
    --rust:#F7ADAD; --sky:#A8E2F7;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0B0E11; --bg:#0B0E11; --surface:#1C222A; --surface2:#2B333D; --surface3:#3A444F;
      --border:#2B333D; --border2:#3A444F; --rule:#3A444F;
      --text:#F4F7F9; --muted:#B6C2CC; --dim:#98A5B1; --head:#D6F5F0; --link:#A8E2F7;
      --flag:#F7ADAD; --accent:#5EEAD4; --accent-hi:#8FF3E3; --onAccent:#0B0E11; --onHead:#0B0E11;
      --flagBg:rgba(247,173,173,.12); --flagBorder:rgba(247,173,173,.38);
      --pickWash:#232B34; --ringTrack:#2B333D; --chipInk:#0B0E11; --tagInk:#F4F7F9;
      --tagCarb:#2B4A46; --tagHappy:#28414E; --tagCraving:#4A3336;
      --chipFast:#5EEAD4; --chipDay:#8FF3E3; --chipWeek:#A8E2F7;
      --chipTrack:#5EEAD4; --chipIntake:#8FF3E3; --chipSet:#3A444F;
      --up:#F7ADAD; --down:#5EEAD4; --cardShadow:0 1px 0 rgba(94,234,212,.10);
      --gold:#D6F5F0; --gold-deep:#5EEAD4; --gold-hi:#8FF3E3; --sage:#5EEAD4;
      --rust:#F7ADAD; --sky:#A8E2F7;
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);}
  body{
    font-family:'Rubik',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-weight:400; color:var(--text); font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  a{color:var(--sky);}

  /* Numbers must be isolated LTR runs. Without this RTL reorders a leading
     minus to the trailing side and "-0.9" renders as "0.9-" — a wrong sign,
     silently, everywhere a delta appears. */
  .n{direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums;}

  /* ---- shell ---- */
  .wrap{
    width:100%; max-width:412px; margin:0 auto; background:var(--bg);
    display:flex; flex-direction:column; gap:var(--gap);
    padding:0 var(--side) calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  @media (min-width:768px){
    .wrap{max-width:1000px; display:grid; grid-template-columns:1fr 1fr;
          gap:var(--gap) 20px; align-items:start; padding-top:8px;}
    .wrap > .full{grid-column:1 / -1;}
    .col{display:flex; flex-direction:column; gap:var(--gap); min-width:0;}
  }

  /* ---- header ---- */
  .hdr{display:flex; align-items:center; justify-content:space-between; padding:14px 2px 2px;}
  .hdr .brand{display:flex; align-items:baseline; gap:8px;}
  .hdr .name{font-size:17px; font-weight:700; letter-spacing:.2px;}
  .hdr .date{font-size:12px; color:var(--muted);}
  .statusChip{
    display:flex; align-items:center; gap:6px; background:var(--surface);
    border:1px solid var(--border2); border-radius:var(--r-pill); padding:4px 10px;
    font-size:12px; font-weight:500; white-space:nowrap;
  }
  .statusChip .dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .statusChip.on{color:var(--sage);} .statusChip.on .dot{background:var(--sage);}
  .statusChip.off{color:var(--dim);} .statusChip.off .dot{background:var(--dim);}

  /* ---- cards ---- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
        padding:var(--pad); display:flex; flex-direction:column; gap:12px; box-shadow:var(--cardShadow);}
  .cardTitle{font-size:15px; font-weight:600;}
  .cardHead{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .hint{font-size:11px; color:var(--dim);}

  /* ---- fasting hero ---- */
  .hero{gap:14px;}
  .heroRow{display:flex; align-items:center; gap:16px;}
  .ringBox{position:relative; width:124px; height:124px; flex-shrink:0;}
  .ringCenter{position:absolute; inset:0; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:1px; text-align:center;}
  /* 18px is the ceiling: the clear area inside r=52 with a 9px stroke is ~95px.
     Enlarging this pushes HH:MM:SS outside the ring. */
  .ringTime{font-size:18px; font-weight:600; letter-spacing:.3px;}
  .ringSub{font-size:11px; color:var(--muted);}
  .heroInfo{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .heroInfo .eyebrow{font-size:11px; font-weight:500; letter-spacing:1px; color:var(--dim);}
  .heroInfo .phase{font-size:18px; font-weight:600; color:var(--gold); line-height:1.25;}
  .heroInfo .next{font-size:13px; color:var(--muted); line-height:1.5;}
  .heroInfo .next b{font-weight:500; color:var(--text);}
  .heroInfo .start{font-size:12px; color:var(--dim);}

  /* ---- phase strip: segment widths are sqrt(hours), so the 36h tail
         doesn't swallow the four short early phases ---- */
  .stripWrap{display:flex; flex-direction:column; gap:6px;}
  .strip{display:flex; gap:3px; height:8px; direction:ltr;}
  .strip .seg{border-radius:4px; background:var(--surface3); position:relative; overflow:hidden;}
  .strip .seg.done{background:var(--gold-deep);}
  .strip .seg .fill{position:absolute; inset:0; background:var(--gold); border-radius:4px;
                    transition:width .5s ease;}
  .axis{display:flex; justify-content:space-between; font-size:10px; color:var(--dim); direction:ltr;}

  /* ---- controls ---- */
  .btnRow{display:flex; gap:8px;}
  .btn{background:var(--surface2); border:1px solid var(--border2); color:var(--text);
       font-size:14px; font-weight:500; border-radius:var(--r-ctl); padding:11px; cursor:pointer;
       transition:background .15s;}
  .btn:hover{background:var(--surface3);}
  .btn.grow{flex:1;}
  .btn.quiet{color:var(--muted); font-weight:400; padding:11px 16px;}
  .btn.gold,.btn.accent{background:var(--accent); border-color:var(--accent); color:var(--onAccent); font-weight:600; padding:10px 18px;}
  .btn.gold:hover,.btn.accent:hover{background:var(--accent-hi);}
  .btn.danger{color:var(--rust);}
  .linkBtn{background:none; border:none; color:var(--sky); font-size:13px; cursor:pointer; padding:0;}
  .linkBtn.muted{color:var(--dim); font-size:12px; font-weight:400;}
  .toggleBtn{display:flex; align-items:center; justify-content:space-between; background:none;
             border:none; color:var(--text); font-size:15px; font-weight:600; padding:0;
             cursor:pointer; width:100%;}
  .chip{padding:7px 13px; border-radius:var(--r-pill); font-size:13px; border:1px solid var(--border2);
        color:var(--muted); background:var(--surface2); cursor:pointer;}
  .chip.active{background:var(--accent); color:var(--onAccent); border-color:var(--accent); font-weight:600;}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local]{
    background:var(--surface2); border:1px solid var(--border2); color:var(--text);
    font-family:inherit; font-size:14px; border-radius:var(--r-ctl); padding:10px 12px;
    outline:none; width:100%; direction:ltr; text-align:right;
  }
  /* A date field has fixed-width internals (dd/mm/yyyy + the picker glyph). In a
     flex row it must not shrink below them, or it collapses to the icon alone
     and there is nothing left to tap. */
  input[type=date],input[type=time],input[type=datetime-local]{
    text-align:left; min-width:9.5em; flex:1 1 auto; min-height:44px;
  }
  /* The indicator is the reliable tap target on Android; make it big and
     visible rather than a dark glyph on a dark field. */
  input[type=date]::-webkit-calendar-picker-indicator{
    opacity:1; cursor:pointer; padding:6px; margin-inline-start:4px;
  }
  /* ---- touch hardening ----
     Android Chrome turns a tap that lingers into a text selection when the
     target's label is selectable text: the selection handles appear and the
     click never fires. Every control here is a Hebrew word inside a button,
     which is exactly that shape — and a swallowed tap on "+ הוספה" or
     "רישום לתאריך אחר" means the date field is never even rendered, which
     reads as "none of the date pickers work".
     touch-action:manipulation additionally drops the double-tap-zoom wait so
     the first tap activates. Inputs must KEEP selection — caret placement in
     a text field is not optional. */
  button,.btn,.chip,.fold,.linkBtn,[role=checkbox],[data-fold],[data-goto],[data-goday]{
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  input,textarea{-webkit-user-select:text; user-select:text; touch-action:manipulation;}

  input[type=text]{direction:rtl;}
  input::placeholder{color:var(--dim);}
  input:focus{border-color:var(--gold);}
  label.check{display:flex; gap:8px; align-items:flex-start; cursor:pointer;
              font-size:12.5px; color:var(--muted); line-height:1.5;}
  label.check input{margin-top:3px; accent-color:var(--gold); flex:0 0 auto;}

  /* ---- status blocks ---- */
  .blocks{display:flex; flex-direction:column; gap:12px;}
  .blk{display:flex; flex-direction:column; gap:3px;}
  .blk .k{font-size:11px; font-weight:600; letter-spacing:.8px; color:var(--gold);}
  .blk .v{font-size:13.5px; color:var(--text); line-height:1.6;}
  .blk.warn .k{color:var(--rust);}
  .blk.warn .v{color:var(--rust);}

  /* ---- phase guide ---- */
  .guideRows{display:flex; flex-direction:column; gap:8px;}
  .gRow{display:flex; gap:10px; align-items:baseline; padding:8px 10px;
        border-radius:var(--r-ctl); background:transparent; border:1px solid var(--border);}
  .gRow .range{font-size:12px; color:var(--dim); white-space:nowrap;}
  .gRow .label{font-size:13.5px; color:var(--text);}
  .gRow.now{background:rgba(224,183,92,.08); border-color:rgba(224,183,92,.35);}
  .gRow.now .label{color:var(--gold); font-weight:600;}

  /* ---- tiles ---- */
  .tiles3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .tile{background:var(--surface2); border-radius:var(--r-tile); padding:10px;
        display:flex; flex-direction:column; gap:2px; align-items:center; text-align:center;}
  .tile .l{font-size:11px; color:var(--muted);}
  .tile .v{font-size:16px; font-weight:600;}
  .tile .u{font-size:10px; color:var(--dim);}
  .statTile{background:var(--surface); border-radius:var(--r-tile-lg); padding:12px;
            display:flex; flex-direction:column; gap:3px; align-items:flex-start;}
  .statTile .l{font-size:11px; color:var(--muted);}
  .statTile .v{font-size:19px; font-weight:600;}
  .statTile .d{font-size:11px;}
  .down{color:var(--down);} .up{color:var(--up);} .flat{color:var(--dim);}

  /* ---- verdict badges ---- */
  .verdict{font-size:12px; font-weight:600; border-radius:var(--r-pill); padding:5px 12px; white-space:nowrap;}
  .verdict.ahead,.verdict.onpace{background:rgba(127,199,155,.12); border:1px solid rgba(127,199,155,.4); color:var(--sage);}
  .verdict.behind{background:rgba(240,139,112,.12); border:1px solid rgba(240,139,112,.4); color:var(--rust);}
  .verdict.none{background:var(--surface2); border:1px solid var(--border2); color:var(--muted);}
  .badge{font-size:11px; border-radius:var(--r-pill); padding:2px 8px; border:1px solid currentColor; white-space:nowrap;}

  /* ---- signal ---- */
  .signal{background:var(--surface); border-radius:var(--r-tile-lg); padding:12px 14px;
          display:flex; gap:10px; align-items:flex-start;}
  .signal .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px;}
  .signal .txt{font-size:12.5px; color:var(--muted); line-height:1.5;}

  /* ---- chart ---- */
  .plot{position:relative; height:150px;}
  .plot svg{display:block; width:100%; height:150px; direction:ltr;}
  .plotLabel{position:absolute; font-size:10px; background:var(--surface); padding:0 4px; white-space:nowrap;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted);}
  .legend span.i{display:flex; align-items:center; gap:5px;}
  .legend .swDot{width:8px; height:8px; border-radius:50%; background:var(--text);}
  .legend .swLine{width:14px; height:2px; background:var(--gold);}
  .legend .swDash{width:14px; height:0; border-top:2px dashed var(--dim);}

  /* ---- stepper ---- */
  /* forced LTR so it always reads [−][value][+], the universal shape for a
     numeric control — RTL would put the minus on the far side of the plus */
  .stepper{display:flex; align-items:center; gap:2px; flex:0 0 auto; direction:ltr;
           background:var(--surface2); border:1px solid var(--border2); border-radius:var(--r-pill); padding:2px;}
  .stepBtn{width:34px; height:34px; border-radius:50%; border:none; background:transparent;
           color:var(--text); font-size:18px; line-height:1; cursor:pointer;
           display:flex; align-items:center; justify-content:center; transition:background .12s;}
  .stepBtn:hover{background:var(--surface3);}
  .stepBtn:active{background:var(--gold); color:#14171A;}
  .stepVal{min-width:28px; text-align:center; font-size:15px; font-weight:600;}

  /* ---- intake summary: label / how long ago / stage ---- */
  .summaryGrid{display:flex; flex-direction:column; gap:6px; background:var(--surface2);
               border-radius:var(--r-tile); padding:10px 12px;}
  .sumRow{display:grid; grid-template-columns:4.2em 7.6em 1fr; gap:8px; align-items:baseline; font-size:12.5px;}
  .sumLabel{color:var(--muted);}
  .sumAgo{color:var(--text); font-weight:500; white-space:nowrap;}
  .sumStage{color:var(--gold); min-width:0;}
  @media (max-width:380px){ .sumRow{grid-template-columns:3.8em 7em 1fr; font-size:11.5px;} }

  /* ---- logging to a past day: make it impossible to miss ---- */
  .card.pastDay{border:1px solid var(--gold-deep);}
  .pastBanner{display:flex; align-items:center; justify-content:space-between; gap:10px;
              background:rgba(224,183,92,.10); border:1px solid rgba(224,183,92,.35);
              border-radius:var(--r-tile); padding:8px 12px; font-size:12.5px; color:var(--gold);}

  /* ---- Ayurvedic lens: visually distinct so it is never mistaken for the
         evidence-based content next to it ---- */
  .blk.ayurBlk{border-top:1px solid var(--border2); padding-top:10px;}
  .blk.ayurBlk .k{color:var(--sky);}
  .card.ayur{border:1px solid var(--border2); background:linear-gradient(180deg,rgba(127,182,224,.05),transparent 55%);}
  .card.ayur .blk .k{color:var(--sky);}
  .ayurNote{font-size:11.5px; color:var(--muted); line-height:1.6; padding:8px 10px;
            background:var(--surface2); border-radius:var(--r-tile); border:1px solid var(--border2);}

  /* unsaved past-day edits */
  .stepper.dirty{border-color:var(--gold); box-shadow:0 0 0 2px rgba(224,183,92,.18);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn:disabled:hover{background:var(--surface2);}

  /* ================= v3 screens ================= */
  .topBar{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 4px;}
  /* Latin-only display faces. Scoped to these two lines and nothing else —
     Cormorant and Petit Formal Script carry no Hebrew glyphs, so any leak
     into Hebrew text would silently fall back to a system font. */
  .brand{background:none;border:none;cursor:pointer;padding:0;display:flex;
         flex-direction:column;align-items:flex-start;gap:1px;direction:ltr;}
  .brandName{font-family:'Petit Formal Script',cursive;font-size:23px;line-height:1.05;
             color:var(--head);}
  .brandSub{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:11px;
            letter-spacing:3.2px;text-transform:uppercase;color:var(--muted);}

  /* ---- collapsible sections ---- */
  .fold{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
        background:none;border:none;padding:0;cursor:pointer;color:var(--text);font-family:inherit;}
  .foldTitle{font-size:15px;font-weight:600;}
  .foldMark{font-size:12px;color:var(--dim);}
  .topRight{display:flex;gap:8px;align-items:center;}
  .fastPill,.homePill{display:flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--border2);border-radius:var(--r-pill);padding:5px 11px;
    font-size:12px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit;}
  .fastPill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent,var(--sage));}
  .screenHead{display:flex;align-items:center;gap:10px;padding:2px 2px 0;color:var(--head,var(--gold));}
  .screenTitle{font-size:18px;font-weight:700;color:var(--text);}
  .ico{flex:0 0 auto;}

  /* ---- home ---- */
  .homeFast{flex-direction:row;align-items:center;gap:14px;text-align:start;cursor:pointer;
            border:1px solid var(--border);width:100%;font-family:inherit;color:inherit;}
  .hfRing{flex:0 0 auto;}
  .hfBody{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .hfLabel{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--accent,var(--gold));}
  .hfTime{font-size:24px;font-weight:700;}
  .hfPhase{font-size:12.5px;color:var(--muted);}
  .homePair{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .homeMini{align-items:flex-start;gap:4px;text-align:start;cursor:pointer;
            border:1px solid var(--border);font-family:inherit;color:inherit;}
  .hmLabel{font-size:11px;color:var(--muted);}
  .hmVal{font-size:22px;font-weight:700;}
  .hmDelta{font-size:12px;}
  .hmTags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
  .hmEmpty{font-size:12px;color:var(--dim);}
  .tileGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{align-items:flex-start;gap:10px;cursor:pointer;border:1px solid var(--border);
        font-family:inherit;color:inherit;text-align:start;}
  .tileChip{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;
            justify-content:center;color:var(--chipInk,#14171A);}
  .c-fast{background:var(--chipFast);} .c-day{background:var(--chipDay);}
  .c-week{background:var(--chipWeek);} .c-track{background:var(--chipTrack);}
  .c-intake{background:var(--chipIntake);} .c-set{background:var(--chipSet);}
  .tileLabel{font-size:13.5px;font-weight:600;}

  /* ---- day: ruled notepad ---- */
  .dayCard{gap:12px;overflow:hidden;}
  .dayHead{display:flex;flex-direction:column;gap:10px;margin:-4px -4px 0;padding:4px;}
  .dayHeadRow{display:flex;align-items:center;gap:8px;color:var(--head,var(--gold));}
  .dayHeadDate{margin-inline-start:auto;font-size:12px;color:var(--muted);}
  .dayStrip{display:flex;gap:5px;}
  .dayPill{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
           background:var(--surface2);border:1px solid var(--border2);border-radius:12px;
           padding:6px 2px;cursor:pointer;font-family:inherit;color:var(--muted);}
  .dayPill .dp1{font-size:9.5px;} .dayPill .dp2{font-size:14px;font-weight:700;color:var(--text);}
  .dayPill.sel{background:var(--head,var(--gold));border-color:var(--head,var(--gold));}
  .dayPill.sel .dp1,.dayPill.sel .dp2{color:var(--onHead,#14171A);}
  .dayRow{display:flex;align-items:center;gap:8px;}
  .rowLabel{font-size:12px;color:var(--muted);min-width:3em;}
  .numIn{width:5.5em;text-align:center;}
  .unit{font-size:12px;color:var(--muted);}
  .btn.sm{padding:8px 14px;font-size:13px;}
  .chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;
       background:none;border:none;padding:4px 0;color:var(--text);font-family:inherit;}
  .chkBox{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);
          display:inline-block;position:relative;flex:0 0 auto;}
  .chk[aria-checked="true"] .chkBox{background:var(--accent);border-color:var(--accent);}
  .chk[aria-checked="true"] .chkBox::after{content:"";position:absolute;inset-inline-start:6px;top:2px;
    width:5px;height:10px;border:solid var(--onAccent);border-width:0 2px 2px 0;transform:rotate(45deg);}
  .chk:focus-visible .chkBox{outline:2px solid var(--accent);outline-offset:2px;}
  .tagBar{display:flex;gap:6px;flex-wrap:wrap;}
  .tagBtn{border:1px solid var(--border2);background:var(--surface2);color:var(--text);
          border-radius:var(--r-pill);padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .tagBtn.picking{background:var(--head,var(--gold));border-color:var(--head,var(--gold));color:var(--onHead,#14171A);}
  .tagCount{font-weight:700;}
  .pickBar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--flagBg);border:1px solid var(--flagBorder);border-radius:var(--r-tile);
    padding:8px 12px;font-size:12.5px;color:var(--flag);}
  .rules{display:flex;flex-direction:column;}
  .ruleRow{display:flex;align-items:center;gap:8px;min-height:54px;
           border-bottom:1px dashed var(--rule);padding:4px 0;}
  .ruleRow:last-child{border-bottom:none;}
  .ruleRow.picking{background:var(--pickWash);}
  .slotName{flex:0 0 48px;background:none;border:none;font-size:11px;font-weight:600;
            color:var(--link,var(--sky));text-align:start;padding:0;font-family:inherit;}
  .ruleRow.picking .slotName{cursor:pointer;text-decoration:underline;}
  .slotName:disabled{cursor:default;}
  .slotIn{flex:1;background:none;border:none;padding:6px 0;font-size:14px;color:var(--text);
          direction:rtl;text-align:start;min-width:0;}
  .slotIn:focus{outline:none;border-bottom:1px solid var(--accent,var(--gold));}
  .slotTags{display:flex;gap:4px;flex-wrap:wrap;flex:0 0 auto;}
  .tagPill{font-size:10.5px;border-radius:var(--r-pill);padding:3px 8px;border:none;
           font-family:inherit;cursor:default;color:var(--tagInk);}
  button.tagPill{cursor:pointer;}
  .t-carb{background:var(--tagCarb);} .t-happy{background:var(--tagHappy);}
  .t-craving{background:var(--tagCraving);} .t-train{background:var(--chipFast);}
  .flagBar{background:var(--flagBg);border:1px solid var(--flagBorder);color:var(--flag);
           border-radius:var(--r-tile);padding:8px 12px;font-size:12.5px;}

  .foldBody{display:flex;flex-direction:column;gap:12px;}
  .foldBody .card{border:none;box-shadow:none;padding:0;background:none;}

  /* ---- week ---- */
  .weekList{display:flex;flex-direction:column;gap:8px;}
  .weekRow{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;padding:12px;cursor:pointer;
    font-family:inherit;color:inherit;text-align:start;
    border-inline-start:4px solid var(--border2);}
  .weekRow.isToday{border-inline-start-color:var(--accent,var(--gold));}
  .wDate{flex:0 0 40px;display:flex;flex-direction:column;align-items:center;}
  .wD1{font-size:10px;color:var(--muted);} .wD2{font-size:17px;font-weight:700;}
  .wBody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .wSum{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wLines{display:flex;flex-direction:column;gap:3px;}
  .wLine{display:flex;align-items:baseline;gap:6px;font-size:12.5px;min-width:0;}
  .wSlot{flex:0 0 42px;font-size:10.5px;color:var(--link);font-weight:600;}
  .wText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wSum.empty{color:var(--dim);}
  .wTags{display:flex;gap:4px;flex-wrap:wrap;}
  .wTrain{flex:0 0 auto;color:var(--accent,var(--gold));font-weight:700;}

  .segRow{display:flex;gap:6px;}
  .seg{flex:1;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);
       border-radius:var(--r-ctl);padding:9px;font-size:13px;cursor:pointer;font-family:inherit;}
  .seg.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:600;}

  /* ---- lists ---- */
  .rows{display:flex; flex-direction:column; gap:6px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;
       font-size:13px; padding:6px 2px; border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row .d{color:var(--muted);}
  .rowVals{display:flex; gap:10px; align-items:center;}
  .x{color:var(--rust); background:none; border:none; cursor:pointer; font-size:14px; padding:2px 6px;}
  .note{font-size:12px; color:var(--dim); line-height:1.6;}

  /* ---- banners / empty ---- */
  .banner{border-radius:var(--r-tile); padding:12px 14px; font-size:12.5px; line-height:1.5;
          display:flex; gap:10px; align-items:center; justify-content:space-between;}
  .banner.warn{background:rgba(240,139,112,.10); border:1px solid rgba(240,139,112,.35); color:var(--rust);}
  .banner.info{background:var(--surface2); border:1px solid var(--border2); color:var(--muted);}
  .empty{text-align:center; padding:18px 8px; color:var(--muted); font-size:13px;}
  .empty b{display:block; color:var(--text); font-size:15px; font-weight:600; margin-bottom:6px;}

  /* ---- toast ---- */
  .toastBox{position:fixed; inset-inline:14px; bottom:14px; z-index:50; display:flex; justify-content:center;}
  .toast{background:var(--surface3); border:1px solid var(--border2); border-radius:var(--r-tile);
         padding:12px 14px; display:flex; justify-content:space-between; align-items:center;
         gap:12px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.5); width:100%; max-width:412px;}

  .foot{font-size:11px; color:var(--dim); text-align:center; line-height:1.7; padding:4px 12px 0;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
<script src="ui.js"></script>
<script src="selftest.js"></script>
</body>
</html>
